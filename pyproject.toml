[project]
name = "juphedge"
version = "0.1.0"
description = "Solana portfolio hedger composing 5+ Jupiter APIs, including Prediction Markets as insurance."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
